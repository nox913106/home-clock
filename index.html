<!DOCTYPE html>
<!-- 【v5.3】放大版 (Scale up 50%) -->
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現在時間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        /* 基礎設定 */
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            -webkit-font-smoothing: antialiased;
            opacity: 0;
            transition: opacity .5s ease-in;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            margin: 0;
            padding: 1.5rem;
            /* 放大內距 */
        }

        .dark body {
            background-color: #0f172a;
        }

        /* 主容器：放大尺寸 */
        #main-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;

            /* 內距放大 */
            padding: 0.75rem 2.25rem;
            width: fit-content;
            min-width: auto;
            /* 高度放大 1.5倍 (4.5rem * 1.5 = 6.75rem) */
            height: 6.75rem;

            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            /* 圓角放大 */
            box-shadow:
                0 15px 25px -5px rgba(0, 0, 0, 0.1),
                0 8px 10px -6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .dark #main-container {
            background-color: #1e293b;
            border-color: #334155;
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* 左側區域：時鐘 */
        .left-section {
            display: flex;
            align-items: center;
            padding-right: 2.25rem;
            /* 間距放大 */
        }

        /* 中間區域：日期 */
        .middle-section {
            display: flex;
            align-items: center;
            padding-left: 2.25rem;
            padding-right: 2.25rem;
            border-left: 2px solid #e2e8f0;
            /* 線條加粗一點點 */
            border-right: 2px solid #e2e8f0;
            height: 3.75rem;
            /* 分隔線高度放大 */
        }

        .dark .middle-section {
            border-color: #334155;
        }

        /* 右側區域 */
        .right-section {
            display: flex;
            align-items: center;
            gap: 0;
            padding-left: 2.25rem;
        }

        /* 日期文字：字體放大 */
        #d {
            color: #64748b;
            /* 字體放大 (1rem * 1.5 = 1.5rem) */
            font-size: 1.5rem;
            font-weight: 600;
            white-space: nowrap;
            letter-spacing: 0.05em;
        }

        .dark #d {
            color: #94a3b8;
        }

        /* 時間校正狀態（日期下方） */
        .middle-section {
            flex-direction: column;
            justify-content: center;
        }

        #sync-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.15rem;
            padding: 0.1rem 0.5rem;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: #94a3b8;
            font: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.4;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color .2s;
        }

        #sync-status:hover {
            background-color: #f1f5f9;
        }

        .dark #sync-status {
            color: #64748b;
        }

        .dark #sync-status:hover {
            background-color: #334155;
        }

        #sync-status .sync-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background-color: #94a3b8;
            flex-shrink: 0;
        }

        #sync-status[data-state="ok"] .sync-dot {
            background-color: #10b981;
        }

        #sync-status[data-state="failed"] .sync-dot {
            background-color: #f59e0b;
        }

        #sync-status[data-state="syncing"] .sync-dot {
            background-color: #3b82f6;
            animation: sync-pulse 1s ease-in-out infinite;
        }

        @keyframes sync-pulse {
            50% { opacity: 0.3; }
        }

        /* 資訊項目 */
        .info-item {
            display: flex;
            align-items: center;
            border-right: 2px solid #e2e8f0;
            /* 線條加粗 */
            padding-right: 1.1rem;
            /* 間距放大 */
            margin-right: 1.1rem;
            height: 2.25rem;
            /* 高度放大 */
        }

        .info-item:last-child {
            border-right: none;
            padding-right: 0;
            margin-right: 0;
        }

        .dark .info-item {
            border-color: #334155;
        }

        /* 資訊卡片按鈕：字體與圖示放大 */
        .info-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            /* 間距放大 */
            padding: 0.6rem 0.9rem;
            /* 內距放大 */
            border-radius: 0.75rem;
            background-color: transparent;
            color: #64748b;
            /* 字體放大 (0.875rem * 1.5 ~= 1.3rem) */
            font-size: 1.3rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
            text-decoration: none;
            height: 3rem;
            /* 高度放大 */
        }

        .info-card:hover {
            background-color: #f1f5f9;
            color: #334155;
        }

        .dark .info-card {
            color: #94a3b8;
        }

        .dark .info-card:hover {
            background-color: #334155;
            color: #f8fafc;
        }

        .info-card.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* 圖示放大 */
        .info-icon {
            width: 1.5rem;
            /* 1rem * 1.5 */
            height: 1.5rem;
        }

        /* --- 翻頁時鐘容器 --- */
        #time-container {
            display: flex;
            gap: 0.5rem;
            /* 間距放大 */
            font-family: 'Roboto Mono', monospace;
            perspective: 450px;
            /* 透視感微調 */
            padding: 0;
            background-color: transparent;
        }

        /* 冒號：尺寸放大 */
        .flip-colon {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.75rem;
            /* 字體放大 (1.8rem * 1.5 = 2.7rem) */
            font-size: 2.7rem;
            font-weight: 700;
            line-height: 1;
            color: #334155;
        }

        .dark .flip-colon {
            color: #cbd5e1;
        }

        .flip-colon::before,
        .flip-colon::after {
            content: '';
            display: block;
            /* 圓點放大 */
            width: 0.375rem;
            height: 0.375rem;
            background-color: currentColor;
            border-radius: 50%;
        }

        /* --- 翻頁卡片：尺寸放大 --- */

        .flip-tile {
            position: relative;
            /* 寬度放大 (1.9em * 1.5 = 2.85em) */
            width: 2.85em;
            /* 高度放大 (2.8rem * 1.5 = 4.2rem) */
            height: 4.2rem;
            /* 字體放大 (2.2rem * 1.5 = 3.3rem) */
            font-size: 3.3rem;
            font-weight: 700;
            line-height: 1;
            border-radius: 0.45rem;
            /* 圓角放大 */
            background-color: #333;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
        }

        .flip-card {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            backface-visibility: hidden;
            background-color: #334155;
            color: #f8fafc;
        }

        .dark .flip-card {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        .flip-card span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 200%;
            text-align: center;
            /* 行高必須等於 Tile 總高度 */
            line-height: 4.2rem;
            display: block;
        }

        /* 上半部 */
        .card-top {
            top: 0;
            border-radius: 0.45rem 0.45rem 0 0;
            transform-origin: bottom;
        }

        .card-top span {
            top: 0;
            transform: translateY(0.75px);
        }

        .card-top::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 5;
        }

        .dark .card-top::after {
            background-color: rgba(0, 0, 0, 0.1);
        }

        /* 下半部 */
        .card-bottom {
            bottom: 0;
            border-radius: 0 0 0.45rem 0.45rem;
            transform-origin: top;
        }

        .card-bottom span {
            top: -100%;
            transform: translateY(0.75px);
        }

        /* 動畫邏輯 */
        .flip-leaf-front,
        .flip-leaf-back {
            z-index: 3;
            visibility: hidden;
        }

        .flip-leaf-back {
            transform: rotateX(180deg);
        }

        .flipping .flip-leaf-front,
        .flipping .flip-leaf-back {
            visibility: visible;
        }

        .flipping .flip-leaf-front {
            animation: flipDownFront 0.5s ease-in-out forwards;
        }

        .flipping .flip-leaf-back {
            animation: flipDownBack 0.5s ease-in-out forwards;
        }

        @keyframes flipDownFront {
            0% {
                transform: rotateX(0deg);
            }

            100% {
                transform: rotateX(-180deg);
            }
        }

        @keyframes flipDownBack {
            0% {
                transform: rotateX(180deg);
            }

            100% {
                transform: rotateX(0deg);
            }
        }

        .card-top::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.1));
            pointer-events: none;
        }

        /* 響應式調整 */
        @media (max-width: 1280px) {

            /* 寬度較大時就開始隱藏文字，因為放大後佔位較多 */
            .info-text {
                display: none;
            }

            .left-section {
                padding-right: 1.5rem;
            }

            .middle-section {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }

            .right-section {
                padding-left: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            #main-container {
                padding: 1.5rem;
                height: auto;
                flex-direction: column;
                width: 90%;
            }

            .left-section,
            .right-section {
                padding: 0;
                width: 100%;
                justify-content: center;
            }

            .middle-section {
                border-left: none;
                border-right: none;
                border-top: 2px solid #e2e8f0;
                border-bottom: 2px solid #e2e8f0;
                width: 100%;
                justify-content: center;
                padding: 1rem 0;
                margin: 1rem 0;
                height: auto;
            }

            .dark .middle-section {
                border-color: #334155;
            }

            #d {
                padding-left: 0;
                border: none;
            }

            .right-section {
                gap: 1.5rem;
            }

            .info-item {
                border-right: none;
                padding-right: 0;
                margin-right: 0;
            }
        }
    </style>
</head>

<body>

    <div id="main-container">
        <!-- 左側：時鐘 -->
        <div class="left-section">
            <div id="time-container"></div>
        </div>

        <!-- 中間：日期 -->
        <div class="middle-section">
            <div id="d"></div>
            <button id="sync-status" type="button" data-state="syncing" title="點擊立即重新校正"><span class="sync-dot"></span><span class="sync-text">校正中…</span></button>
        </div>

        <!-- 右側：資訊卡片 -->
        <div class="right-section">
            <div class="info-item">
                <a id="location-card" href="#" target="_blank" class="info-card loading">
                    <svg xmlns="http://www.w3.org/2000/svg" class="info-icon" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                    <span id="l-text" class="info-text">Loading...</span>
                </a>
            </div>
            <div class="info-item">
                <a id="ip-card" href="#" target="_blank" class="info-card loading">
                    <svg xmlns="http://www.w3.org/2000/svg" class="info-icon" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z" />
                        <path d="M2 12h20" />
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                    </svg>
                    <span id="ip-text" class="info-text">IP...</span>
                </a>
            </div>
            <div class="info-item">
                <button id="theme-toggle" type="button" class="info-card" title="切換主題">
                    <svg id="theme-icon-moon" class="info-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                    <svg id="theme-icon-sun" class="info-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M12 12a4 4 0 110-8 4 4 0 010 8z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
            (function (d) {
                const T = { weekdays: ['週日', '週一', '週二', '週三', '週四', '週五', '週六'], loading: '...', ip: 'IP', unknownLocation: '未知' };

                function initializeTheme() {
                    const htmlEl = d.documentElement;
                    const toggleBtn = d.getElementById('theme-toggle');
                    const sunIcon = d.getElementById('theme-icon-sun');
                    const moonIcon = d.getElementById('theme-icon-moon');
                    function updateIcons(isDark) {
                        sunIcon.style.display = isDark ? 'block' : 'none';
                        moonIcon.style.display = isDark ? 'none' : 'block';
                    }
                    function loadTheme() {
                        const savedTheme = localStorage.getItem('theme');
                        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                            htmlEl.classList.add('dark');
                            updateIcons(true);
                        } else {
                            htmlEl.classList.remove('dark');
                            updateIcons(false);
                        }
                    }
                    toggleBtn.addEventListener('click', () => {
                        const isDark = htmlEl.classList.toggle('dark');
                        localStorage.setItem('theme', isDark ? 'dark' : 'light');
                        updateIcons(isDark);
                    });
                    loadTheme();
                }

                window.L = function (json) {
                    if (!json) return;
                    const locationCard = d.getElementById('location-card');
                    const lText = d.getElementById('l-text');
                    const ipCard = d.getElementById('ip-card');
                    const ipText = d.getElementById('ip-text');
                    const ip = json.ip || '';
                    const city = json.city || T.unknownLocation;
                    const countryCode = json.country || '';
                    lText.innerText = `${city}, ${countryCode}`;
                    locationCard.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${city}, ${countryCode}`)}`;
                    locationCard.classList.remove('loading');
                    ipText.innerText = `${T.ip}: ${ip}`;
                    ipCard.href = `https://ipinfo.io/${ip}`;
                    ipCard.classList.remove('loading');
                };
                const locationScript = d.createElement('script');
                locationScript.src = `https://ipinfo.io?callback=L`;
                d.head.appendChild(locationScript);

                function createFlipTile(id) {
                    const tile = d.createElement('div');
                    tile.className = 'flip-tile';
                    tile.id = id;
                    tile.innerHTML = `
                    <div class="flip-card card-top static-top"><span></span></div>
                    <div class="flip-card card-bottom static-bottom"><span></span></div>
                    <div class="flip-card card-top flip-leaf-front"><span></span></div>
                    <div class="flip-card card-bottom flip-leaf-back"><span></span></div>
                `;
                    return tile;
                }

                function initTileValue(tile, val) {
                    tile.dataset.val = val;
                    tile.querySelector('.static-top span').innerText = val;
                    tile.querySelector('.static-bottom span').innerText = val;
                    tile.querySelector('.flip-leaf-front span').innerText = val;
                    tile.querySelector('.flip-leaf-back span').innerText = val;
                }

                function updateFlipTile(tile, newVal) {
                    const oldVal = tile.dataset.val;
                    if (newVal === oldVal) return;

                    const staticTop = tile.querySelector('.static-top span');
                    const staticBottom = tile.querySelector('.static-bottom span');
                    const leafFront = tile.querySelector('.flip-leaf-front span');
                    const leafBack = tile.querySelector('.flip-leaf-back span');

                    staticTop.innerText = newVal;
                    staticBottom.innerText = oldVal;
                    leafFront.innerText = oldVal;
                    leafBack.innerText = newVal;

                    tile.classList.remove('flipping');
                    void tile.offsetWidth;
                    tile.classList.add('flipping');

                    const onAnimEnd = () => {
                        staticBottom.innerText = newVal;
                        tile.classList.remove('flipping');
                        tile.removeEventListener('animationend', onAnimEnd);
                    };

                    tile.querySelector('.flip-leaf-back').addEventListener('animationend', onAnimEnd, { once: true });
                    tile.dataset.val = newVal;
                }

                function createColon() {
                    const colon = d.createElement('div');
                    colon.className = 'flip-colon';
                    return colon;
                }

                // ===== 網路時間校正 =====
                // 瀏覽器無法直接使用 NTP (UDP 123)，因此改向「本身與 NTP 同步、且開放 CORS」的
                // HTTPS 時間來源取樣，並以 NTP 相同的演算法計算偏移：
                //   offset = 伺服器時間 - (送出時刻 + 往返時間 / 2)
                // 每個來源取多次樣本，採用往返時間最短（最準）的一筆。
                const SYNC_SAMPLES = 4;
                const SYNC_TIMEOUT = 3000;
                const RESYNC_INTERVAL = 30 * 60 * 1000;
                let timeOffset = 0;
                let syncInfo = null;

                const TIME_SOURCES = [
                    {
                        name: 'Cloudflare',
                        url: 'https://www.cloudflare.com/cdn-cgi/trace',
                        precision: 0,
                        parse: async (res) => {
                            const m = (await res.text()).match(/^ts=([\d.]+)$/m);
                            return m ? parseFloat(m[1]) * 1000 : NaN;
                        }
                    },
                    {
                        name: 'Akamai',
                        url: 'https://time.akamai.com/?ms',
                        precision: 0,
                        parse: async (res) => parseFloat(await res.text()) * 1000
                    },
                    {
                        // 最後備援：本站伺服器 (GitHub Pages) 回應的 Date 標頭，只有秒級精度
                        name: location.host || 'Server',
                        url: location.protocol.startsWith('http') ? location.href.split('#')[0] : null,
                        method: 'HEAD',
                        precision: 500,
                        parse: async (res) => {
                            const date = res.headers.get('Date');
                            return date ? Date.parse(date) + 500 : NaN;
                        }
                    }
                ];

                async function sampleOnce(source) {
                    const ctrl = new AbortController();
                    const timer = setTimeout(() => ctrl.abort(), SYNC_TIMEOUT);
                    try {
                        const url = source.url + (source.url.includes('?') ? '&' : '?') + '_=' + Date.now();
                        const sent = Date.now();
                        const p0 = performance.now();
                        const res = await fetch(url, { method: source.method || 'GET', cache: 'no-store', signal: ctrl.signal });
                        const rtt = performance.now() - p0;
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const serverTime = await source.parse(res);
                        if (!isFinite(serverTime)) throw new Error('無效的時間格式');
                        return { offset: serverTime - (sent + rtt / 2), rtt };
                    } finally {
                        clearTimeout(timer);
                    }
                }

                async function syncWithSource(source) {
                    let best = null;
                    for (let i = 0; i < SYNC_SAMPLES; i++) {
                        try {
                            const sample = await sampleOnce(source);
                            if (!best || sample.rtt < best.rtt) best = sample;
                        } catch (e) {
                            if (i === 0) throw e; // 第一次就失敗，直接換下一個來源
                        }
                    }
                    return best;
                }

                let syncState = 'syncing'; // syncing | ok | failed
                let syncPromise = null;
                let lastSyncAttempt = 0;

                async function runSync() {
                    syncState = 'syncing';
                    lastSyncAttempt = Date.now();
                    for (const source of TIME_SOURCES) {
                        if (!source.url) continue;
                        try {
                            const best = await syncWithSource(source);
                            if (!best) continue;
                            timeOffset = best.offset;
                            syncInfo = { source: source.name, offset: best.offset, error: best.rtt / 2 + source.precision, at: Date.now() };
                            syncState = 'ok';
                            console.log(`✅ 時間校正 (${source.name})：偏移 ${best.offset.toFixed(0)}ms，誤差 ±${syncInfo.error.toFixed(0)}ms`);
                            return true;
                        } catch (e) {
                            console.warn(`❌ ${source.name} 校正失敗：`, e.message || e);
                        }
                    }
                    console.warn('⚠️ 所有時間來源都無法連線，沿用上次校正結果或本地時間');
                    syncState = 'failed';
                    return false;
                }

                // 同一時間只跑一次校正
                function syncTime() {
                    if (!syncPromise) syncPromise = runSync().finally(() => { syncPromise = null; });
                    return syncPromise;
                }

                function nowCorrected() {
                    return new Date(Date.now() + timeOffset);
                }

                function formatAgo(ms) {
                    const min = Math.floor(ms / 60000);
                    if (min < 1) return '剛剛';
                    if (min < 60) return `${min} 分鐘前`;
                    return `${Math.floor(min / 60)} 小時前`;
                }

                function formatClock(ts) {
                    const t = new Date(ts + timeOffset);
                    return [t.getHours(), t.getMinutes(), t.getSeconds()].map(n => ('0' + n).slice(-2)).join(':');
                }

                function syncStatus() {
                    const next = `下次校正：${formatClock(lastSyncAttempt + RESYNC_INTERVAL)}`;
                    const detail = syncInfo
                        ? `時間來源：${syncInfo.source}\n本機時鐘偏差：${syncInfo.offset >= 0 ? '+' : ''}${(syncInfo.offset / 1000).toFixed(3)} 秒\n誤差：±${Math.round(syncInfo.error)} ms\n上次校正：${formatClock(syncInfo.at)}`
                        : '';
                    if (syncState === 'syncing') {
                        return { text: '校正中…', title: '正在與網路時間伺服器校正' };
                    }
                    if (syncState === 'ok') {
                        return { text: `已校正 · ${formatAgo(Date.now() - syncInfo.at)}`, title: `${detail}\n${next}\n\n點擊立即重新校正` };
                    }
                    return {
                        text: syncInfo ? `校正失敗 · 上次 ${formatAgo(Date.now() - syncInfo.at)}` : '未校正 · 使用本機時間',
                        title: `無法連接時間伺服器${detail ? '\n\n' + detail : ''}\n${next}\n\n點擊立即重試`
                    };
                }

                function initializeTime() {
                    const timeContainer = d.getElementById('time-container');
                    const dateEl = d.getElementById('d');
                    const statusEl = d.getElementById('sync-status');
                    const statusText = statusEl.querySelector('.sync-text');
                    const hEl = createFlipTile('h');
                    const mEl = createFlipTile('m');
                    const sEl = createFlipTile('s');
                    const pad = (n) => ('0' + n).slice(-2);

                    const now = nowCorrected();
                    initTileValue(hEl, pad(now.getHours()));
                    initTileValue(mEl, pad(now.getMinutes()));
                    initTileValue(sEl, pad(now.getSeconds()));

                    timeContainer.appendChild(hEl);
                    timeContainer.appendChild(createColon());
                    timeContainer.appendChild(mEl);
                    timeContainer.appendChild(createColon());
                    timeContainer.appendChild(sEl);

                    function render() {
                        const now = nowCorrected();
                        updateFlipTile(hEl, pad(now.getHours()));
                        updateFlipTile(mEl, pad(now.getMinutes()));
                        updateFlipTile(sEl, pad(now.getSeconds()));

                        const dateText = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${T.weekdays[now.getDay()]}`;
                        if (dateEl.textContent !== dateText) dateEl.textContent = dateText;

                        const status = syncStatus();
                        if (statusEl.dataset.state !== syncState) statusEl.dataset.state = syncState;
                        if (statusText.textContent !== status.text) statusText.textContent = status.text;
                        if (statusEl.title !== status.title) statusEl.title = status.title;
                    }

                    // 對齊到「校正後時間」的整秒邊界，避免 setInterval 漂移造成跳秒
                    function tick() {
                        render();
                        const ms = (Date.now() + timeOffset) % 1000;
                        setTimeout(tick, 1000 - ms + 5);
                    }

                    function resync() {
                        const p = syncTime();
                        render();
                        p.then(render);
                    }

                    tick();

                    // 背景校正，不阻塞畫面；之後定期、分頁回到前景、或點擊狀態列時重新校正
                    resync();
                    setInterval(resync, RESYNC_INTERVAL);
                    statusEl.addEventListener('click', resync);
                    d.addEventListener('visibilitychange', () => {
                        if (d.visibilityState === 'visible' && Date.now() - lastSyncAttempt > 5 * 60 * 1000) resync();
                    });
                }

                initializeTheme();
                initializeTime();
                d.body.style.opacity = 1;
            })(document);
    </script>
</body>

</html>
